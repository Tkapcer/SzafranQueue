services:
  db:
    image: postgres:15-alpine
    container_name: my_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: my_laravel
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/var/www/html
      - ./.env:/var/www/html/.env
      - vendor_data:/var/www/html/vendor
      - app_flags:/var/flags
    # Instaluje paczki, robi migracje i odpala serwer na host 0.0.0.0
    command: >
      sh -c "
      if [ ! -f vendor/autoload.php ]; then composer install; fi;
      if ! grep -q '^APP_KEY=base64' .env; then php artisan key:generate; fi;
      
      php artisan migrate --force;
      
      if [ ! -f /var/flags/.seeded ]; then 
          echo 'Uruchamianie seederów po raz pierwszy...';
          php artisan db:seed --force;
          touch /var/flags/.seeded; 
      fi;
      
      php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  db_data:
  app_flags:
  vendor_data: